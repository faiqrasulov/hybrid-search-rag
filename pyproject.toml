[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybridrag"
version = "0.1.0"
description = "Retrieval-augmented generation where retrieval is measured: BM25 from scratch, dense, hybrid fusion and reranking on BEIR SciFact, plus a cited Claude answer layer."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Faiq Rasulov" }]
keywords = ["rag", "information-retrieval", "bm25", "hybrid-search", "beir", "reranking"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "snowballstemmer>=2.2",
    "sentence-transformers>=3.0",
    "anthropic>=0.86",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "scikit-learn>=1.3",
]

[project.scripts]
hybridrag = "hybridrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
